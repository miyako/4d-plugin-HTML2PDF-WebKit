name: Bump version

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Semantic version bump
        options:
          - patch
          - minor
          - major
        default: patch
        required: true

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: bump coordinated version metadata
        id: bump
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" != branch ]; then
            echo "Bump version requires a selected branch" >&2
            exit 1
          fi
          NEW=$(python3 scripts/release.py bump --mode "$MODE")

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore: bump version to ${NEW}"
          git -c push.followTags=false push --no-follow-tags origin "HEAD:refs/heads/${GITHUB_REF_NAME}"

          echo "version=${NEW}" >> "$GITHUB_OUTPUT"

      - name: summary
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: echo "### Bumped to v${VERSION} (metadata only). Run Build separately on the desired branch." >> "$GITHUB_STEP_SUMMARY"
